<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Сыры&amp;Колбасы</title>
<meta name="theme-color" content="#f2f0ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Сыры&amp;Колбасы">
<link rel="stylesheet" href="styles.css?v=3">
<link rel="stylesheet" href="tiles.css?v=4">
<!-- MAX Bridge: даёт window.WebApp внутри мессенджера. Вне MAX приложение работает как обычный сайт -->
<script src="https://st.max.ru/js/max-web-app.js"></script>
</head>
<body>
<div id="app">
<header class="hero">
<div class="hero__bar">
<button class="round-btn" data-action="home" aria-label="В начало" id="homeBtn"></button>
<span class="hero__spacer"></span>
<button class="round-btn" data-action="toggle-search" aria-label="Поиск" id="searchBtn"></button>
<button class="round-btn" data-action="open-menu" aria-label="Меню" id="menuBtn"></button>
</div>
<div class="hero__brand">
<h1 id="shopName">Сыры&amp;Колбасы</h1>
<p id="tagline"></p>
</div>
</header>

<section class="panel">
<div id="searchRow" class="search" hidden><input id="search" type="search" placeholder="Найти товар" autocomplete="off"></div>
<button id="placeBar" class="placebar" data-action="open-place"></button>
<div id="banners" class="banners"></div>
</section>

<nav id="cats" class="cats" aria-label="Разделы"></nav>

<main id="catalog" class="catalog"></main>
<div id="empty" class="empty" hidden>Ничего не нашлось</div>
<div id="loading" class="empty">Загружаем каталог…</div>
</div>

<button id="cartBar" class="cartbar" data-action="open-cart" hidden></button>
<div id="sheets"></div>
<div id="toast" class="toast" role="status"></div>

<script src="config.js?v=3"></script>
<script src="demo-data.js?v=9"></script>
<script src="app.js?v=3"></script>
<script src="checkout.js?v=3"></script>
<script>if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });</script>
</body>
</html>
